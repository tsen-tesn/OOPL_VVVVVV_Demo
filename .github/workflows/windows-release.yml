name: Windows Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build-windows",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
            "-DCMAKE_POLICY_DEFAULT_CMP0077=NEW",
            "-DSDL2MIXER_INSTALL=OFF",
            "-DSDL2MIXER_VENDORED=ON",
            "-DSDL2MIXER_FLAC=OFF",
            "-DSDL2MIXER_MIDI=OFF",
            "-DSDL2MIXER_MOD=OFF",
            "-DSDL2MIXER_OPUS=OFF",
            "-DSDL2MIXER_OGG=OFF",
            "-DSDL2MIXER_VORBIS=OFF",
            "-DSDL2MIXER_VOC=OFF"
          )
          cmake @cmakeArgs

      - name: Build
        run: cmake --build build-windows --config Release --target VVVVVV_DEMO

      - name: Package
        shell: pwsh
        run: |
          $packageDir = "dist/VVVVVV_DEMO-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $exe = Get-ChildItem -Path "build-windows" -Filter "VVVVVV_DEMO.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Path "build-windows" -Recurse | Select-Object FullName
            throw "VVVVVV_DEMO.exe was not found in build-windows."
          }

          Copy-Item $exe.FullName "$packageDir/VVVVVV_DEMO.exe"
          Copy-Item "Resources" "$packageDir/Resources" -Recurse
          New-Item -ItemType Directory -Force -Path "$packageDir/PTSD" | Out-Null
          Copy-Item "PTSD/assets" "$packageDir/PTSD/assets" -Recurse
          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/VVVVVV_DEMO-windows-x86_64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VVVVVV_DEMO-windows-x86_64
          path: dist/VVVVVV_DEMO-windows-x86_64.zip
